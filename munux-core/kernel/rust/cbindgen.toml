language = "C"
header = """/*
 * Munux Rust Static Library - C Interface
 *
 * Generated by cbindgen. Do not edit by hand.
 * Regenerate with: make rust-headers
 */"""
include_guard = "MUNUX_RS_H"
no_includes = false
sys_includes = ["stdint.h", "stddef.h"]
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "type"

[export]
prefix = ""
item_types = ["functions", "constants", "structs", "enums", "typedefs"]

[export.rename]
"usize" = "size_t"
"isize" = "intptr_t"

[parse]
parse_deps = false

[fn]
prefix = ""
sort_by = "Name"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"
